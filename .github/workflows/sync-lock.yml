name: Sync Lockfile

on:
  push:
    branches:
      - feat/waneia-v4-crm-conversacional

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/waneia-v4-crm-conversacional
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Sync package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock after Next.js security update"
          git push origin HEAD:feat/waneia-v4-crm-conversacional
